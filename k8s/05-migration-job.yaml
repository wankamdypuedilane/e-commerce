# Job de migration : s'execute une fois et se termine.
# A relancer apres chaque changement de schema, avant le deploiement
# de la nouvelle version de l'application.
apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: django-migrate
spec:
  # Conserve le Job 5 minutes apres sa reussite, le temps de lire les logs
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: dilane-shop:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: dilane-shop-config
            - secretRef:
                name: dilane-shop-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
