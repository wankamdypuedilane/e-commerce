# MODELE — ne contient aucune valeur reelle.
#
# Les secrets ne sont jamais versionnes. Creer le Secret avec :
#
#   kubectl create secret generic dilane-shop-secrets \
#     --namespace dilane-shop \
#     --from-literal=DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
#     --from-literal=DB_PASSWORD="..." \
#     --from-literal=STRIPE_PUBLIC_KEY="pk_test_..." \
#     --from-literal=STRIPE_SECRET_KEY="sk_test_..." \
#     --from-literal=STRIPE_WEBHOOK_SECRET="whsec_..." \
#     --from-literal=BREVO_SMTP_LOGIN="..." \
#     --from-literal=BREVO_SMTP_KEY="..." \
#     --from-literal=EMAIL_FROM="..."
#
# Attention : un Secret Kubernetes n'est pas chiffré par defaut, il est
# seulement encode en base64. Le chiffrement au repos doit etre active
# sur le cluster. Pour un deploiement reel, envisager Sealed Secrets,
# External Secrets Operator ou le fournisseur de secrets du cloud.
