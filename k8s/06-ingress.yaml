apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dilane-shop
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: dilane-shop
  annotations:
    # Taille maximale des fichiers envoyes (images produits)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Toute requete HTTP est redirigee vers HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dilane-shop.local
      secretName: tls-dilane-shop
  rules:
    - host: dilane-shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
