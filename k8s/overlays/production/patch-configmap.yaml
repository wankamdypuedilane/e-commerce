# Les deux cles qui dependent du domaine. Un correctif de fusion ajoute
# ses cles a celles de la base, sans effacer les autres.
#
# localhost et 127.0.0.1 sont conserves a cote du domaine public : les
# sondes de vie et de disponibilite interrogent /healthz/ avec l'en-tete
# Host: localhost. Les retirer ferait repondre 400 a Django, et aucun pod
# ne deviendrait pret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dilane-shop-config
  namespace: dilane-shop
data:
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,dilane-shop.store"
  # Sans cette variable, toute soumission de formulaire est rejetee
  # des lors que le site est servi en HTTPS derriere un Ingress.
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://dilane-shop.store"
  # --- Durcissement HTTPS des cookies (issue #105) ---
  # Production uniquement : absent de l'overlay local (site en HTTP sous kind).
  # Django sait que la requete est chiffree via SECURE_PROXY_SSL_HEADER
  # (X-Forwarded-Proto pose par l'Ingress), donc pose bien le flag Secure.
  #
  # HSTS n'est PAS defini ici : l'Ingress l'envoie deja
  # (Strict-Transport-Security: max-age=31536000; includeSubDomains).
  # SECURE_SSL_REDIRECT reste a False : la redirection HTTP->HTTPS est faite
  # par l'Ingress pour le trafic externe ; l'activer dans Django casserait le
  # scrape Prometheus interne (/metrics en HTTP direct, sans X-Forwarded-Proto).
  DJANGO_SESSION_COOKIE_SECURE: "True"
  DJANGO_CSRF_COOKIE_SECURE: "True"
