# Routes fermées à l'Ingress : paiement, compte, administration.
#
# Le test de capacité ne lit que l'accueil, la recherche et les fiches.
# Toute route qui écrit, paie ou envoie un courriel répond 503 avant
# d'atteindre Django : le Service ci-dessous n'a ni sélecteur ni point de
# terminaison, ingress-nginx n'a donc nulle part où relayer. Un chemin plus
# long l'emporte sur « / » de l'Ingress principal.
apiVersion: v1
kind: Service
metadata:
  name: routes-fermees
  namespace: dilane-shop
  labels:
    app.kubernetes.io/part-of: capacite
spec:
  type: ClusterIP
  ports:
    - port: 80
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routes-fermees
  namespace: dilane-shop
  labels:
    app.kubernetes.io/part-of: capacite
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - capacite.dilane-shop.store
      secretName: tls-capacite
  rules:
    - host: capacite.dilane-shop.store
      http:
        paths:
          - { path: /checkout, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /paiement, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /confirmation, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /webhooks, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /inscription, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /connexion, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /profil, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /mot-de-passe-oublie, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /reinitialisation, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
          - { path: /admin, pathType: Prefix, backend: { service: { name: routes-fermees, port: { number: 80 } } } }
