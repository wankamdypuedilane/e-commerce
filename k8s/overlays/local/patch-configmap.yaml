# Les deux cles qui dependent du domaine. Un correctif de fusion ajoute
# ses cles a celles de la base, sans effacer les autres.
#
# localhost et 127.0.0.1 sont indispensables : les sondes de vie et de
# disponibilite interrogent /healthz/ avec l'en-tete Host: localhost.
# Sans eux, Django repond 400 et aucun pod ne devient pret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dilane-shop-config
  namespace: dilane-shop
data:
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,dilane-shop.local"
  # Sans cette variable, toute soumission de formulaire est rejetee
  # des lors que le site est servi en HTTPS derriere un Ingress.
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://dilane-shop.local"
