apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: django
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: django
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: django
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: django
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # un pod supplementaire pendant la mise a jour
      maxUnavailable: 0    # aucun pod retire avant qu'un nouveau soit pret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django
    spec:
      containers:
        - name: django
          image: dilane-shop:0.1.0
          # L'image est chargee localement par kind, jamais telechargee
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dilane-shop-config
            - secretRef:
                name: dilane-shop-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
