apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: django
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: django
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: django
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: django
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # un pod supplementaire pendant la mise a jour
      maxUnavailable: 0    # aucun pod retire avant qu'un nouveau soit pret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django
    spec:
      containers:
        - name: django
          # Nom logique, sans registre ni etiquette : chaque overlay les
          # definit par le champ "images" de sa kustomization, avec la
          # politique de telechargement correspondante.
          image: dilane-shop
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dilane-shop-config
            - secretRef:
                name: dilane-shop-secrets
          # Le pod est-il pret a recevoir du trafic ?
          # Un echec le retire du Service, sans le tuer.
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Le pod est-il encore vivant ?
          # Un echec le fait redemarrer. Seuils plus larges que la
          # readiness : on ne tue pas un pod pour une lenteur passagere.
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
