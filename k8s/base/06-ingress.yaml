apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dilane-shop
  namespace: dilane-shop
  labels:
    app.kubernetes.io/name: dilane-shop
  annotations:
    # Taille maximale des fichiers envoyes (images produits)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Toute requete HTTP est redirigee vers HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # dilane-shop.example n'est qu'un substitut : le TLD .example est reserve
  # par la RFC 2606 et ne resout jamais. Chaque overlay remplace ce nom par
  # son domaine reel (voir overlays/*/patch-ingress.yaml). La base n'est pas
  # destinee a etre appliquee seule.
  tls:
    - hosts:
        - dilane-shop.example
      secretName: tls-dilane-shop
  rules:
    - host: dilane-shop.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
