kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dilane-shop

nodes:
  # Noeud de controle, qui heberge aussi l'Ingress
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose les ports 80 et 443 du cluster vers la machine hote
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Deux noeuds de travail, pour observer la repartition des pods
  - role: worker
  - role: worker
