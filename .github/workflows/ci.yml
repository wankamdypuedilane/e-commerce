name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # Version épinglée : ubuntu-latest bascule sur Ubuntu 26 le 19/10/2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La CI teste l'image réellement déployée, avec PostgreSQL :
      # fichiers statiques collectés, version de Python et moteur de base
      # identiques à la production. Ces valeurs n'existent que le temps du job.
      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-$(openssl rand -hex 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-$(openssl rand -hex 16)|" .env

      # Scan des dépendances avant toute construction : échec immédiat si une
      # vulnérabilité connue touche l'application ou ses outils de test.
      - name: Dependency vulnerability scan
        run: >
          docker run --rm -v "$PWD:/src:ro" python:3.13-slim
          sh -c "pip install --quiet --root-user-action=ignore pip-audit==2.10.1
          && pip-audit -r /src/requirements-dev.txt"

      - name: Build image
        run: docker compose build web tests

      - name: Start database
        run: docker compose up -d --wait db

      - name: Django check
        run: docker compose run --rm web python manage.py check

      - name: Django tests with coverage
        run: docker compose run --rm tests sh -c "coverage run manage.py test && coverage report"

      - name: Django deployment check
        run: >
          docker compose run --rm
          -e DJANGO_ALLOWED_HOSTS=example.com
          web python manage.py check --deploy --fail-level ERROR

      # Test de fumée : démarre le vrai conteneur de production. Les tests
      # passent par le client de test de Django et ne lancent jamais
      # gunicorn : sans cette étape, une erreur de démarrage passe inaperçue.
      - name: Container smoke test
        run: |
          docker compose up -d web
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/healthz/ && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz/
          if docker compose logs web | grep -q '\[ERROR\]'; then
            echo "Erreur dans les journaux de démarrage :"
            docker compose logs web
            exit 1
          fi

      - name: Stop stack
        if: always()
        run: docker compose down -v
