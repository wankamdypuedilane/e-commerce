name: CI/CD Deploy EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # Version épinglée : ubuntu-latest bascule sur Ubuntu 26 le 19/10/2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # La CI teste l'image réellement déployée, avec PostgreSQL :
      # fichiers statiques collectés, version de Python et moteur de base
      # identiques à la production. Ces valeurs n'existent que le temps du job.
      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-$(openssl rand -hex 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-$(openssl rand -hex 16)|" .env

      # Scan des dépendances avant toute construction : échec immédiat si une
      # vulnérabilité connue touche l'application ou ses outils de test.
      - name: Dependency vulnerability scan
        run: >
          docker run --rm -v "$PWD:/src:ro" python:3.13-slim
          sh -c "pip install --quiet --root-user-action=ignore pip-audit==2.10.1
          && pip-audit -r /src/requirements-dev.txt"

      - name: Build image
        run: docker compose build web tests

      - name: Start database
        run: docker compose up -d --wait db

      - name: Django check
        run: docker compose run --rm web python manage.py check

      - name: Django tests with coverage
        run: docker compose run --rm tests sh -c "coverage run manage.py test && coverage report"

      - name: Django deployment check
        run: >
          docker compose run --rm
          -e DJANGO_ALLOWED_HOSTS=example.com
          web python manage.py check --deploy --fail-level ERROR

      - name: Stop stack
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: false  # Desactive : instance EC2 supprimee. Remplace au Sprint 10 par un deploiement Kubernetes.
    steps:
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          [[ -n "$EC2_HOST" ]] || { echo "Missing secret: EC2_HOST"; exit 1; }
          [[ -n "$EC2_USER" ]] || { echo "Missing secret: EC2_USER"; exit 1; }
          [[ -n "$EC2_PROJECT_PATH" ]] || { echo "Missing secret: EC2_PROJECT_PATH"; exit 1; }
          [[ -n "$EC2_SSH_KEY" ]] || { echo "Missing secret: EC2_SSH_KEY"; exit 1; }
          echo "Deploy secrets look present."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add host key
        env:
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          PORT="${EC2_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
        run: |
          set -e
          PORT="${EC2_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$PORT" "$EC2_USER@$EC2_HOST" "
            set -e
            cd '$EC2_PROJECT_PATH'
            test -d .git
            git pull --ff-only origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart dilane-shop
            sudo systemctl restart nginx
            python manage.py check --deploy
          "
