<!doctype html>
<!--
  Page 500 personnalisee (issue #55).

  AUTONOME A DESSEIN : Django rend la 500 via server_error, sans RequestContext.
  Aucune variable de contexte n'est disponible ; ce gabarit n'herite donc
  d'aucun autre, ne charge aucune bibliotheque de balises, n'emploie aucune
  balise de routage ni jeton de securite, et ne touche pas la base. Toute
  dependance de ce genre casserait la page d'erreur elle-meme. HTML complet,
  style en ligne, lien de retour en dur vers "/". Couleur principale du
  site : #2c3e50.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Une erreur est survenue</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #2c3e50;
        background: #f8f9fa;
      }
      .erreur {
        text-align: center;
        padding: 2rem;
        max-width: 32rem;
      }
      .erreur .code {
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
        color: #2c3e50;
      }
      .erreur h1 {
        font-size: 1.5rem;
        margin: 0.5rem 0 1rem;
      }
      .erreur p {
        color: #6c757d;
        margin-bottom: 1.5rem;
      }
      .erreur a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        background: #2c3e50;
        color: #fff;
        text-decoration: none;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="erreur">
      <p class="code">500</p>
      <h1>Une erreur est survenue</h1>
      <p>
        Un probleme technique nous empeche d'afficher cette page. L'incident a
        ete enregistre ; merci de reessayer dans un instant.
      </p>
      <a href="/">Retour a l'accueil</a>
    </div>
  </body>
</html>
